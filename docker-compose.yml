services:
  # 0. Detector de IP del host (corre una vez antes del backend)
  detector-ip:
    image: alpine:3.20
    network_mode: host
    volumes:
      - ./detectar-ip-host.sh:/detectar-ip-host.sh:ro
      - shared-config:/shared
    command: sh -c "apk add --no-cache iproute2 >/dev/null 2>&1; sh /detectar-ip-host.sh"
    restart: "no"

  # 1. Base de Datos (PostgreSQL 16 optimizada para alta concurrencia)
  db:
    image: postgres:16-alpine
    restart: always
    ports:
      - "${DB_PUERTO_HOST:-5433}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plantillas_db}
      POSTGRES_USER: ${POSTGRES_USER:-plantillas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
    volumes:
      - pgdata_v16:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plantillas} -d ${POSTGRES_DB:-plantillas_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - red-plantillas

  # 1.1 Redis 7 Alpine (Caché en memoria y Colas de Tareas BullMQ)
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_PUERTO_HOST:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - red-plantillas

  # 2. Migrador e Inicializador (One-Shot: corre una vez antes de que arranquen las réplicas)
  migrador:
    build:
      context: ./plantillas-backend
      dockerfile: Dockerfile
    restart: "no"
    working_dir: /app
    command: >
      sh -c "until node -e \"require('net').connect(5432, 'db').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\"; do
               echo '[migrador] Esperando a la base de datos Postgres...';
               sleep 2;
             done;
             echo '[migrador] Ejecutando migraciones pendientes...';
             npx sequelize-cli db:migrate;
             echo '[migrador] Verificando seeders...';
             if [ \"\$(echo \"SELECT COUNT(*) FROM usuario;\" | PGPASSWORD=${DB_PASSWORD:-postgres} psql -h db -U ${DB_USUARIO:-plantillas} -d ${DB_NOMBRE:-plantillas_db} -t -A 2>/dev/null)\" = \"0\" ]; then
               echo '[migrador] Tabla usuario vacía: ejecutando seeders...';
               npx sequelize-cli db:seed:all || echo '[migrador] Seeders fallaron, continuar de todos modos';
             else
               echo '[migrador] Tabla usuario ya tiene datos: saltando seeders';
             fi;
             echo '[migrador] Asegurando directorios de almacenamiento en /app/public...';
             mkdir -p /app/public/documentos /app/public/externos /app/public/aprobacion /app/public/adjuntos 2>/dev/null || true;
             chown -R node:node /app/public 2>/dev/null || true;
             echo '[migrador] Inicialización completada con éxito.'"
    volumes:
      - ./plantillas-backend:/app
      - backend_node_modules:/app/node_modules
      - plantillas-documentos:/app/public
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red-plantillas

  # 3. Servidor Backend (Node.js 22 LTS - Escalable horizontalmente con --scale backend=N)
  backend:
    build:
      context: ./plantillas-backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${BACKEND_PORT_RANGE:-8000-8010}:8000"
    working_dir: /app
    command: >
      sh -c "if [ -f /shared/url_verificacion.env ] && [ -z \"$$URL_VERIFICACION\" ]; then
               export $$(cat /shared/url_verificacion.env | xargs);
               echo \"[backend] URL_VERIFICACION tomada del detector: $$URL_VERIFICACION\";
             fi;
             echo '[backend] Inicializando API REST en Node 22 LTS...';
             node index.js"
    tty: true
    stdin_open: true
    volumes:
      - ./plantillas-backend:/app
      - backend_node_modules:/app/node_modules
      - plantillas-documentos:/app/public
      - shared-config:/shared:ro
      - plantillas-runtime-config:/app/runtime-config
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NODE_OPTIONS: "--openssl-legacy-provider"
      CHROMIUM_PATH: "/usr/bin/chromium"
      DB_HOST: ${DB_HOST:-db}
      DB_PUERTO: ${DB_PUERTO:-5432}
      DB_USUARIO: ${DB_USUARIO:-plantillas}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NOMBRE: ${DB_NOMBRE:-plantillas_db}
      BACKEND_PUERTO: 8000
      JWT_SECRET: ${JWT_SECRET}
      OPENSSL_CONF: ${OPENSSL_CONF:-/dev/null}
      CORREO_HOST: ${CORREO_HOST:-${SMTP_HOST}}
      CORREO_PUERTO: ${CORREO_PUERTO:-${SMTP_PORT:-587}}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-${SMTP_FROM_NAME:-Sistema de Plantillas}}
      CORREO_ORIGEN: ${CORREO_ORIGEN:-${SMTP_FROM_EMAIL:-${SMTP_USER}}}
      CORREO_USUARIO: ${CORREO_USUARIO:-${SMTP_USER}}
      CORREO_PASSWORD: ${CORREO_PASSWORD:-${SMTP_PASSWORD}}
      CORREO_SECURE: ${CORREO_SECURE:-false}
      CORREO_IGNORETLS: ${CORREO_IGNORETLS:-false}
      CORREO_TLS_RECHAZAR: ${CORREO_TLS_RECHAZAR:-true}
      SMTP_HOST: ${SMTP_HOST:-${CORREO_HOST}}
      SMTP_PORT: ${SMTP_PORT:-${CORREO_PUERTO:-587}}
      SMTP_USER: ${SMTP_USER:-${CORREO_USUARIO}}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-${CORREO_PASSWORD}}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-${CORREO_REMITENTE}}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-${CORREO_ORIGEN}}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_SEARCHBASE: ${LDAP_SEARCHBASE:-}
      LDAP_SEARCHFILTER: ${LDAP_SEARCHFILTER:-}
      ISSUER: ${ISSUER:-}
      CLIENT_ID: ${CLIENT_ID:-}
      CLIENT_SECRET: ${CLIENT_SECRET:-}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MOSPARO_HOST: ${MOSPARO_HOST:-}
      MOSPARO_PUBLICKEY: ${MOSPARO_PUBLICKEY:-}
      MOSPARO_PRIVATEKEY: ${MOSPARO_PRIVATEKEY:-}
      MOSPARO_UUID: ${MOSPARO_UUID:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      detector-ip:
        condition: service_started
      migrador:
        condition: service_completed_successfully
    networks:
      - red-plantillas

  # 4. Servidor Frontend Angular 17 (Nginx Alpine con caché estático directo y balanceo)
  frontend:
    build:
      context: ./plantillas-frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${FRONTEND_PUERTO:-80}:80"
    volumes:
      - ./plantillas-frontend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./plantillas-frontend/src/assets/images:/usr/share/nginx/html/assets/images:ro
      - plantillas-documentos:/usr/share/nginx/html/public:ro
    depends_on:
      - backend
    networks:
      - red-plantillas
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik-public"
      traefik.http.routers.docs-marabunta.rule: "Host(`${TRAEFIK_HOST:-docs.marabuntarl.com}`)"
      traefik.http.routers.docs-marabunta.entrypoints: "websecure"
      traefik.http.routers.docs-marabunta.tls: "true"
      traefik.http.routers.docs-marabunta.tls.certresolver: "letsencrypt"
      traefik.http.services.docs-marabunta.loadbalancer.server.port: "80"
      traefik.http.routers.docs-marabunta-http.rule: "Host(`${TRAEFIK_HOST:-docs.marabuntarl.com}`)"
      traefik.http.routers.docs-marabunta-http.entrypoints: "web"
      traefik.http.routers.docs-marabunta-http.middlewares: "docs-marabunta-https"
      traefik.http.middlewares.docs-marabunta-https.redirectscheme.scheme: "https"

networks:
  red-plantillas:
    driver: bridge
  traefik-public:
    external: true
    name: traefik-public

volumes:
  backend_node_modules:
  pgdata:
  pgdata_v16:
  redis_data:
  plantillas-documentos:
  shared-config:
  plantillas-runtime-config:
