server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Performance: High-throughput sendfile and tcp settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Docker internal DNS resolver for dynamic service discovery and round-robin load balancing
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Angular SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # High-Performance: Archivos estáticos y PDFs servidos DIRECTAMENTE desde disco sin tocar Node.js
    location /public/ {
        alias /usr/share/nginx/html/public/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        sendfile on;
        tcp_nopush on;
        try_files $uri @backend_upstream;
    }

    # Proxy API calls with round-robin load balancing across scaled backend replicas
    location /api/ {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    location /autenticar {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OIDC & Authentik OAuth endpoints
    location /codigo {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /autorizar {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Public verification endpoints for QR codes and legal certs
    location /verificarDocumento {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /pdfVerificado {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /ready {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location @backend_upstream {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
