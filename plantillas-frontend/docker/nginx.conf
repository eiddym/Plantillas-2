server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Performance: High-throughput sendfile and tcp settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Allow large uploads for official documents, attachments, and PDFs
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_body_timeout 300s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Docker internal DNS resolver for dynamic service discovery and round-robin load balancing
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Angular SPA routing fallback (index.html must NEVER be cached by browser)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # Hashed JS and CSS assets can be cached
    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon y activos de imagen estáticos
    location = /favicon.ico {
        root /usr/share/nginx/html;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=86400";
        try_files /favicon.ico =404;
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Bloqueo de seguridad: Prohibir descarga directa de documentos y adjuntos sin autorización
    location ^~ /public/documentos/ {
        return 403;
    }

    location ^~ /public/adjuntos/ {
        return 403;
    }

    location ^~ /public/externos/ {
        return 403;
    }

    location ^~ /public/aprobacion/ {
        return 403;
    }

    # Recursos estáticos institucionales públicos (imágenes, logos de membrete)
    location /public/ {
        alias /usr/share/nginx/html/public/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        sendfile on;
        tcp_nopush on;
        try_files $uri @backend_upstream;
    }

    # Proxy API calls with round-robin load balancing across scaled backend replicas
    location /api/ {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;
    }

    location /autenticar {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OIDC & Authentik OAuth endpoints
    location /codigo {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /autorizar {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Public verification endpoints for QR codes and legal certs
    location /verificarDocumento {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /pdfVerificado {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /ready {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location @backend_upstream {
        set $backend_target "http://backend:8000";
        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
